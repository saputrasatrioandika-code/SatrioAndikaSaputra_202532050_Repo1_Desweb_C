<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="Arial, sans-serif" font-size="14">
  <title>Alur data dan tindakan Tirta Gambut</title>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f5d46"/>
    </marker>
  </defs>
  <rect width="720" height="260" fill="#f7faf8"/>
  <g fill="#ffffff" stroke="#2f5d46" stroke-width="2">
    <rect x="16" y="40" width="140" height="70" rx="8"/>
    <rect x="200" y="40" width="140" height="70" rx="8"/>
    <rect x="384" y="40" width="140" height="70" rx="8"/>
    <rect x="568" y="10" width="140" height="60" rx="8"/>
    <rect x="568" y="90" width="140" height="60" rx="8"/>
    <rect x="200" y="170" width="324" height="60" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f2a24">
    <text x="86" y="70" font-weight="bold">Node Sensor</text><text x="86" y="90">di lahan gambut</text>
    <text x="270" y="70" font-weight="bold">Gateway LoRa</text><text x="270" y="90">penerima data</text>
    <text x="454" y="70" font-weight="bold">Server</text><text x="454" y="90">penilai status</text>
    <text x="638" y="36" font-weight="bold">Peringatan</text><text x="638" y="55">warga dan petugas</text>
    <text x="638" y="116" font-weight="bold">Pompa</text><text x="638" y="135">pembasahan</text>
    <text x="362" y="197" font-weight="bold">Lahan kembali basah</text><text x="362" y="216">sensor membaca kondisi terbaru</text>
  </g>
  <g stroke="#2f5d46" stroke-width="2" fill="none" marker-end="url(#panah)">
    <line x1="156" y1="75" x2="196" y2="75"/>
    <line x1="340" y1="75" x2="380" y2="75"/>
    <path d="M524 65 L564 42"/>
    <path d="M524 85 L564 118"/>
    <path d="M638 150 L638 200 L528 200"/>
    <path d="M200 200 L86 200 L86 114"/>
  </g>
  <text x="176" y="62" text-anchor="middle" font-size="12" fill="#2b7bb9">LoRa</text>
</svg>
