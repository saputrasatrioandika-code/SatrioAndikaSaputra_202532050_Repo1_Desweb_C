<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" font-family="Arial, sans-serif">
  <title>Penampang lahan gambut saat muka air tanah turun</title>
  <rect width="640" height="320" fill="#f4f8fb"/>
  <rect x="0" y="0" width="640" height="90" fill="#dcecf7"/>
  <g fill="#3f7d4f">
    <path d="M60 90 l12 -40 l12 40 z"/><path d="M150 90 l10 -30 l10 30 z"/>
    <path d="M300 90 l14 -48 l14 48 z"/><path d="M470 90 l10 -32 l10 32 z"/><path d="M560 90 l12 -42 l12 42 z"/>
  </g>
  <rect x="0" y="90" width="640" height="70" fill="#a77a4f"/>
  <rect x="0" y="160" width="640" height="120" fill="#5b3b22"/>
  <rect x="0" y="280" width="640" height="40" fill="#8a8a8a"/>
  <g stroke="#7a5432" stroke-width="2">
    <path d="M90 95 l8 20 l-6 14"/><path d="M220 98 l-6 18 l10 16"/><path d="M380 96 l6 22 l-8 12"/><path d="M520 99 l-5 16 l7 18"/>
  </g>
  <line x1="0" y1="160" x2="640" y2="160" stroke="#2b7bb9" stroke-width="4" stroke-dasharray="14 8"/>
  <rect x="404" y="20" width="224" height="30" rx="4" fill="#ffffff" stroke="#2f5d46"/>
  <text x="516" y="40" text-anchor="middle" font-size="14" fill="#1f2a24">Lahan gambut di musim kemarau</text>
  <text x="16" y="120" font-size="15" fill="#ffffff">Lapisan atas kering (rawan terbakar)</text>
  <text x="16" y="186" font-size="15" fill="#cfe6f7">Muka air tanah turun lebih dari 40 cm</text>
  <text x="16" y="230" font-size="15" fill="#ffffff">Gambut jenuh air (masih basah)</text>
  <text x="16" y="305" font-size="14" fill="#ffffff">Tanah mineral</text>
  <line x1="600" y1="90" x2="600" y2="160" stroke="#ffffff" stroke-width="2"/>
  <path d="M594 98 l6 -8 l6 8 M594 152 l6 8 l6 -8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="590" y="130" text-anchor="end" font-size="13" fill="#ffffff">&gt; 40 cm</text>
